lzc-sdk-version: '0.1'
name: Budgero
package: cloud.lazycat.app.budgero
version: 1.0.7
description: Manual-first private budgeting (self-hosted). No bank connections.
homepage: https://budgero.app
author: Federico Liva
locales:
  en:
    name: Budgero
    description: Manual-first private budgeting (self-hosted). No bank connections.
  it:
    name: Budgero
    description: Budgeting privato manuale (self-hosted). Nessun collegamento bancario.
  zh:
    name: Budgero
    description: 手动优先的隐私预算应用（自托管）。无需连接银行账户。

application:
  routes:
    - /=http://budgero.cloud.lazycat.app.budgero.lzcapp:3001
  subdomain: budgero

services:
  budgero:
    # Upstream budgero/budgero v1.13.0 (wrapper docker/Dockerfile). Docker Hub
    # diretto: la copy-image sul registry Lazycat richiede un login lzc-cli
    # interattivo; il NAS tira da docker.io senza problemi (come fliva/ambrogio).
    image: docker.io/fliva/lzc-budgero@sha256:a93e841f6d854bc3aae75a299fb2abbfe7811607caed1087bffbe501ff59c343
    binds:
      - /lzcapp/var/data:/data
    environment:
      - DB_PATH=/data/budgero.db
      - PORT=3001
      - SELF_HOSTABLE=true
      - SELF_HOST_JWT_TTL_HOURS=720
      - BUDGERO_ADMIN_USER=admin
      - BUDGERO_ADMIN_PASS=changeme-on-first-login
      - BUDGERO_ADMIN_NAME=Admin
      # v1.12.x: il server fa CheckOrigin sull'upgrade WebSocket e di default
      # ammette solo localhost — senza questa variabile la web-app da
      # budgero.federicoliva.it resta "Offline" (sync WS rifiutato 403 CORS).
      - WEBSOCKET_ALLOWED_ORIGINS=https://budgero.federicoliva.it,https://budgero.chronos.heiyu.space
      # - CURRENCYLAYER_API_KEY=  # opzionale, abilita multi-currency rates
