
application:
  routes:
    - /=http://budgero.cloud.lazycat.app.budgero.lzcapp:3001
  subdomain: budgero

services:
  budgero:
    # Upstream v1.22.1 (dal 26/11/2026; include nativamente PR #43 SELF_HOST_PUBLIC_IP e #44
    # XXX currency PayPal/SimpleFIN — niente più fork custom). La v1.19.0
    # migra il DB in avanti e senza ritorno: il backup del volume PRIMA
    # dell'upgrade è l'unica strada per tornare alla 1.18.
    #
    # Mirror sul registry Lazycat obbligatorio per lo store; copy-image via
    # PS interop — il login appstore vive nella lzc-cli di Windows, non in
    # quella WSL. Il digest qui NON coincide con quello su docker.io
    # (fliva/lzc-budgero:1.0.18 = sha256:78757c21…): copy-image riscrive il
    # manifest, quindi va riletto dall'output del comando e non dedotto.
    # Da 1.0.20 copy-image stampa un tag del registry, non più un digest:
    # si usa quello (il registry chiede auth, il digest non è rileggibile).
    image: registry.lazycat.cloud/u30562882/fliva/lzc-budgero:e3b105dad6f2818b
    binds:
      - /lzcapp/var/data:/data
    environment:
      - DB_PATH=/data/budgero.db
      - PORT=3001
      - SELF_HOSTABLE=true
      - SELF_HOST_JWT_TTL_HOURS=720
      # Password admin: NON impostata di proposito. L'entrypoint genera una
      # random in /data/admin.pass al primo avvio e la scrive nei log —
      # un default fisso nel manifest sarebbe identico su ogni install dello
      # store. Da v1.19.x il server impone maiuscola+minuscola+cifra, quindi
      # un valore come "changeme-on-first-login" viene rifiutato e l'install
      # pulita resterebbe senza admin.
      - BUDGERO_ADMIN_USER=admin
      - BUDGERO_ADMIN_NAME=Admin
      # v1.12.x: il server fa CheckOrigin sull'upgrade WebSocket e di default
      # ammette solo localhost — senza questa variabile la web-app resta
      # "Offline" (sync WS rifiutato 403 CORS). LAZYCAT_APP_DOMAIN è il
      # dominio che il box assegna a QUESTA app: inchiodare un dominio qui
      # romperebbe ogni altro box. Chi espone l'app anche da un dominio
      # proprio (tunnel Cloudflare, reverse proxy) lo aggiunge in coda:
      #   WEBSOCKET_ALLOWED_ORIGINS=https://${LAZYCAT_APP_DOMAIN},https://budgero.esempio.it
      - WEBSOCKET_ALLOWED_ORIGINS=https://${LAZYCAT_APP_DOMAIN}
      # Fix PSU-IP, serve SOLO al bank-sync (Enable Banking): il
      # reverse-proxy/tunnel Lazycat non porta l'IP pubblico reale fino al
      # container, RealIP() risolve un hop privato (172.28.x) e la richiesta
      # viene rifiutata con "PSU header not provided". Va riempita col
      # proprio IP pubblico o con un hostname DDNS (risolto live ad ogni
      # richiesta ticket, non cachato) — su una linea domestica l'IP cambia.
      # Vuota = bank-sync non funzionante, tutto il resto sì.
      # - SELF_HOST_PUBLIC_IP=mio-ddns.esempio.com
      # - CURRENCYLAYER_API_KEY=  # opzionale, abilita multi-currency rates

  # Client headless (fork f-liva/budgero, spec docs/superpowers/specs/2026-11-24-budgero-headless-client-design.md).
  # Peer della web-app senza UI: API REST su :8787, DB solo in memoria, non carica mai snapshot.
  # Config e segreti (config.json, password, space.key, tokens; mode 600, uid 1001) in
  # /lzcapp/var/headless, scritti da docker/headless/provision.sh: senza config resta not_configured.
  # Va aggiornato INSIEME al server: build dallo stesso tag upstream, altrimenti halt version_mismatch.
  # Nessuna route Lazycat: Ambrogio lo raggiunge con una regola dell'app Forward sul bridge lzc_docker
  # (http://172.18.0.1:8787, solo container del NAS). restart: ignorato da Lazycat, il supervisor rilancia il worker.
  headless:
    image: registry.lazycat.cloud/u30562882/fliva/budgero-headless:f799dd2bde35a9e4
    user: "1001:1001"
    setup_script: mkdir -p /lzcapp/var/headless && chown -R 1001:1001 /lzcapp/var/headless
    binds:
      - /lzcapp/var/headless:/lzcapp/var/headless
    environment:
      - TZ=Europe/Rome
      - BUDGERO_ORIGIN=https://${LAZYCAT_APP_DOMAIN}
    health_check:
      test: [CMD, wget, -qO-, "http://localhost:8787/healthz"]
      start_period: 120s
