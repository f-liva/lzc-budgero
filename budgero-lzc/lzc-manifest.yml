
application:
  routes:
    - /=http://budgero.cloud.lazycat.app.budgero.lzcapp:3001
  subdomain: budgero

services:
  budgero:
    # Upstream v1.19.5 (include nativamente PR #43 SELF_HOST_PUBLIC_IP e #44
    # XXX currency PayPal/SimpleFIN — niente più fork custom). La v1.19.0
    # migra il DB in avanti e senza ritorno: il backup del volume PRIMA
    # dell'upgrade è l'unica strada per tornare alla 1.18.
    #
    # Mirror sul registry Lazycat obbligatorio per lo store; copy-image via
    # PS interop — il login appstore vive nella lzc-cli di Windows, non in
    # quella WSL. Il digest qui NON coincide con quello su docker.io
    # (fliva/lzc-budgero:1.0.18 = sha256:78757c21…): copy-image riscrive il
    # manifest, quindi va riletto dall'output del comando e non dedotto.
    image: registry.lazycat.cloud/u30562882/fliva/lzc-budgero@sha256:cc4014bb4d5ac40ca2cb302cd78d4e6b007aea21d08b7fe7e0d90be93d953238
    binds:
      - /lzcapp/var/data:/data
    environment:
      - DB_PATH=/data/budgero.db
      - PORT=3001
      - SELF_HOSTABLE=true
      - SELF_HOST_JWT_TTL_HOURS=720
      # Password admin: NON impostata di proposito. L'entrypoint genera una
      # random in /data/admin.pass al primo avvio e la scrive nei log —
      # un default fisso nel manifest sarebbe identico su ogni install dello
      # store. Da v1.19.x il server impone maiuscola+minuscola+cifra, quindi
      # un valore come "changeme-on-first-login" viene rifiutato e l'install
      # pulita resterebbe senza admin.
      - BUDGERO_ADMIN_USER=admin
      - BUDGERO_ADMIN_NAME=Admin
      # Fix PSU-IP: il reverse-proxy/tunnel Lazycat non porta l'IP pubblico
      # reale fino al container, RealIP() risolve un hop privato (172.28.x)
      # e il bank-sync (Enable Banking) viene rifiutato ("PSU header not
      # provided"). DDNS perché la linea di casa cambia IP ogni 24h — viene
      # risolto live ad ogni richiesta ticket, non cachato.
      - SELF_HOST_PUBLIC_IP=di369a4.glddns.com
      # v1.12.x: il server fa CheckOrigin sull'upgrade WebSocket e di default
      # ammette solo localhost — senza questa variabile la web-app da
      # budgero.federicoliva.it resta "Offline" (sync WS rifiutato 403 CORS).
      - WEBSOCKET_ALLOWED_ORIGINS=https://budgero.federicoliva.it,https://budgero.chronos.heiyu.space
      # - CURRENCYLAYER_API_KEY=  # opzionale, abilita multi-currency rates
